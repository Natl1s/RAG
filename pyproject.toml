[project]
name = "psb-rag"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "faiss-cpu>=1.15.1",
    "huggingface-hub>=2.4.0",
    "pyarrow>=26.0.1",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.2.0",
    "torch>=2.15.0",
]

[tool.uv.sources]
torch = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cpu"
